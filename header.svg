<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#facc15;stop-opacity:1"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="#0d1117"/>

  <!-- Main text with flickering effect -->
  <text x="400" y="95" font-family="'Courier New', monospace" font-size="42" font-weight="bold" fill="url(#grad1)" text-anchor="middle" filter="url(#glow)">
    &lt;Oscar_Throedsson/&gt;
    <animate attributeName="opacity" 
             values="1;0.8;1;0.95;0.6;1;0.85;1;0.7;1;0.9;1" 
             dur="3s" 
             repeatCount="indefinite"/>
  </text>

  <!-- Subtitle with flickering effect -->
  <text x="400" y="130" font-family="'Courier New', monospace" font-size="20" fill="#facc15" text-anchor="middle">
    Software Developer
    <animate attributeName="opacity" 
             values="1;0.9;1;0.7;1;0.85;0.6;1;0.95;1;0.8;1" 
             dur="3s" 
             begin="0.2s"
             repeatCount="indefinite"/>
  </text>
</svg>
